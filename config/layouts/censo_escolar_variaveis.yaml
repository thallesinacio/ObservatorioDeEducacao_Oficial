# Mapeamento das contagens do Censo Escolar (colunas QT_*) para os fatos do banco.
# Formato: VARIAVEL: [etapa, tipo_recorte:valor_recorte]   (recorte "total" = sem recorte)
# Todas as colunas QT_* do arquivo vão para staging.censo_contagem; só as listadas aqui viram
# linhas em core.fato_matricula / fato_docente / fato_turma. Variável listada que não existe no
# layout do ano simplesmente não gera linha naquele ano (a ausência fica registrada em
# staging.censo_layout e aparece como "sem_dado" nos indicadores).

matricula:
  QT_MAT_BAS: [bas, total]
  QT_MAT_INF: [inf, total]
  QT_MAT_INF_CRE: [inf_cre, total]
  QT_MAT_INF_PRE: [inf_pre, total]
  QT_MAT_FUND: [fund, total]
  QT_MAT_FUND_AI: [fund_ai, total]
