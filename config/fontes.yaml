# Catálogo de fontes do Observatório.
# Uma entrada por fonte. Os campos são carregados em core.dim_fonte.
# "pagina_oficial" é lida pelo coletor para descobrir os links (o INEP muda caminhos e nomes
# de arquivo entre publicações); "padrao_url" é só o fallback, usado se a página mudar.
# Verificações feitas em 29/09/2026 estão resumidas em docs/fontes.md.

fontes:
  - id: censo_escolar
    nome: Microdados do Censo Escolar da Educação Básica
    orgao: INEP
    prioridade: P1
    pagina_oficial: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/censo-escolar
    padrao_url: https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_{ano}.zip
    tipo_acesso: download
    formato: ZIP com CSV (separador ';', latin-1) e dicionário de dados em XLSX
    periodicidade: anual
    anos_disponiveis: "1995-2025 (2025 com layout novo em tabelas separadas)"
    licenca: Dados abertos (Lei de Acesso à Informação); citar a fonte INEP
    latencia_tipica: publicação cerca de 8 a 14 meses após a data de referência
    modulo: observatorio.coleta.censo_escolar
    observacoes: >
      Microdados públicos no nível da escola (contagens QT_* e indicadores IN_*), sem grão de aluno,
      docente ou turma. Layouts: 2015-2021 (370 colunas), 2022 (385), 2023-2024 (408/426) e 2025
      (seis tabelas: Escola, Matricula, Docente, Turma, Gestor e Curso Técnico). O arquivo de 2025
      tem nome com sublinhado final (microdados_censo_escolar_2025_.zip), por isso os links são
      lidos da página.

  - id: sinopse_estatistica
    nome: Sinopse Estatística da Educação Básica
    orgao: INEP
    prioridade: P1
    pagina_oficial: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/sinopses-estatisticas/educacao-basica
    padrao_url: https://download.inep.gov.br/dados_abertos/sinopses_estatisticas/sinopse_estatistica_censo_escolar_{ano}.zip
    tipo_acesso: download
    formato: ZIP com XLSX (uma aba por tabela; linhas por município)
    periodicidade: anual
    anos_disponiveis: "2015-2025 verificados (arquivos de 2015-2019 em informacoes_estatisticas/, 2020 em diante em dados_abertos/)"
    licenca: Dados abertos; citar a fonte INEP
    latencia_tipica: junto com a divulgação do Censo Escolar
    modulo: observatorio.coleta.sinopse
    observacoes: >
      Usada para docentes por escolaridade (E1, E3) e para conferir totais de matrícula dos
      microdados. Conta docente único por município, diferente da soma por escola.

  - id: inep_rendimento
    nome: Indicadores Educacionais - Taxas de Rendimento Escolar
    orgao: INEP
    prioridade: P1
    pagina_oficial: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/indicadores-educacionais/taxas-de-rendimento-escolar
    padrao_url: https://download.inep.gov.br/informacoes_estatisticas/indicadores_educacionais/{ano}/tx_rend_municipios_{ano}.zip
    tipo_acesso: download
    formato: ZIP com XLSX e ODS (cabeçalho em várias linhas, vírgula decimal, marcador "--")
    periodicidade: anual
    anos_disponiveis: "2007-2025"
    licenca: Dados abertos; citar a fonte INEP
    latencia_tipica: cerca de 1 ano (as taxas de um ano dependem da situação final do aluno)
    modulo: observatorio.coleta.inep_indicadores
    observacoes: >
      Página com uma aba por ano (sub-página /<ano>). Nomes de arquivo mudam entre anos
      (tx_rendimento_municipios_2015.zip, TAXA_REND_2016_MUNICIPIOS.zip, TX_REND_MUNICIPIOS_2018.zip ...).
      A aba de 2021 aparece como "2021." na página.

