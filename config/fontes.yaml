  - id: ideb
    nome: Índice de Desenvolvimento da Educação Básica (Ideb) - Resultados
    orgao: INEP
    prioridade: P1
    pagina_oficial: https://www.gov.br/inep/pt-br/areas-de-atuacao/pesquisas-estatisticas-e-indicadores/ideb/resultados
    padrao_url: https://download.inep.gov.br/ideb/resultados/divulgacao_anos_iniciais_municipios_{ano}.zip
    tipo_acesso: download
    formato: ZIP com XLSX e ODS, formato largo (anos em colunas)
    periodicidade: bienal (anos ímpares)
    anos_disponiveis: "2005-2025 (a edição mais recente traz a série inteira)"
    licenca: Dados abertos; citar a fonte INEP
    latencia_tipica: agosto/setembro do ano seguinte ao Saeb
    modulo: observatorio.coleta.ideb
    observacoes: >
      Cada edição baixada é guardada: o INEP revisa valores já publicados. Arquivos por Brasil,
      regiões e UFs, municípios e escolas; anos iniciais, anos finais e ensino médio.

  - id: populacao_datasus
    nome: Estimativas populacionais por município, sexo e idade (RIPSA/Ministério da Saúde)
    orgao: Ministério da Saúde / DATASUS
    prioridade: P1
    pagina_oficial: http://tabnet.datasus.gov.br/cgi/deftohtm.exe?ibge/cnv/popsvs2024br.def
    padrao_url: ftp://ftp.datasus.gov.br/dissemin/publicos/IBGE/POPSVS/POPSBR{aa}.zip
    tipo_acesso: download
    formato: ZIP com DBF (FTP); alternativa pelo TabNet (tabela em texto separada por ';')
    periodicidade: anual
    anos_disponiveis: "2000-2025 (TabNet); arquivos DBF no FTP de 2013 em diante"
    licenca: Dados abertos; citar Ministério da Saúde/RIPSA
    latencia_tipica: revisões eventuais de toda a série (nota técnica RIPSA 01/2025)
    modulo: observatorio.coleta.populacao_datasus
    observacoes: >
      Denominador das taxas de atendimento (A1 a A4). O FTP não pôde ser verificado de dentro do
      ambiente de desenvolvimento; o coletor lista o diretório antes de baixar e, se o FTP falhar,
      usa o TabNet (verificado em 29/09/2026). Cada valor guarda a fonte e a edição usadas.

  - id: sidra_ibge
    nome: IBGE SIDRA - estimativas de população, Censo 2022 e PIB municipal
    orgao: IBGE
    prioridade: P1
    pagina_oficial: https://apisidra.ibge.gov.br
    padrao_url: https://apisidra.ibge.gov.br/values/t/{tabela}/n6/{municipio}/v/{variavel}/p/all
    tipo_acesso: api
    formato: JSON
    periodicidade: anual (estimativas, PIB) e decenal (Censo)
    anos_disponiveis: "6579: 2001-2026; 9514: 2022; 5938: 2002-2023; 9542: 2022"
    licenca: Dados abertos; citar IBGE
    latencia_tipica: PIB municipal com cerca de 2 anos de defasagem
    modulo: observatorio.coleta.sidra
    observacoes: >
      Tabelas usadas: 6579 (população residente estimada), 9514 (Censo 2022 por sexo e idade),
      5938 (PIB a preços correntes, variável 37) e 9542 (Censo 2022, pessoas de 15 anos ou mais
      e alfabetizadas, usada em G2).

  - id: siope
    nome: SIOPE - Sistema de Informações sobre Orçamentos Públicos em Educação (dados abertos)
    orgao: FNDE
    prioridade: P1
    pagina_oficial: https://www.fnde.gov.br/olinda-ide/servico/DADOS_ABERTOS_SIOPE/versao/v1/odata/$metadata
    padrao_url: https://www.fnde.gov.br/olinda-ide/servico/DADOS_ABERTOS_SIOPE/versao/v1/odata/{recurso}(Ano_Consulta=@Ano_Consulta,Num_Peri=@Num_Peri,Sig_UF=@Sig_UF)
    tipo_acesso: api
    formato: JSON (OData)
    periodicidade: anual (6º bimestre)
    anos_disponiveis: "2017 em diante pelo serviço OData (2015 e 2016 retornam vazio)"
    licenca: Dados abertos; citar FNDE
    latencia_tipica: declaração até o fim do 1º trimestre do ano seguinte
    modulo: observatorio.coleta.siope
    observacoes: >
      COD_MUNI tem 6 dígitos (sem o dígito verificador). O recurso Remuneracao_Siope traz nome
      de profissional (dado pessoal) e NÃO é coletado.

  - id: siconfi
    nome: SICONFI - Sistema de Informações Contábeis e Fiscais do Setor Público Brasileiro
    orgao: Tesouro Nacional
    prioridade: P1
    pagina_oficial: https://apidatalake.tesouro.gov.br/docs/siconfi/
    padrao_url: https://apidatalake.tesouro.gov.br/ords/siconfi/tt/{endpoint}
    tipo_acesso: api
    formato: "JSON (ORDS, paginado: items, hasMore, limit=5000, offset)"
    periodicidade: anual (DCA) e bimestral (RREO)
    anos_disponiveis: "2015 em diante"
    licenca: Dados abertos; citar Tesouro Nacional
    latencia_tipica: DCA até 30 de abril do ano seguinte
    modulo: observatorio.coleta.siconfi
    observacoes: >
      O RREO Anexo 08 (MDE) não consta no SICONFI para Juazeiro nem Petrolina (verificado 2016,
      2019, 2023, 2024): a conferência de F1 é feita com a DCA Anexo I-E (despesa por função
      12 - Educação), que bate com a despesa liquidada declarada no SIOPE.

