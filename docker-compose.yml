services:
  postgres:
    image: postgres:16
    container_name: observatorio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OBS_DB_NOME:-observatorio}
      POSTGRES_USER: ${OBS_DB_USUARIO:-observatorio_etl}
      POSTGRES_PASSWORD: ${OBS_DB_SENHA:?defina OBS_DB_SENHA no arquivo .env}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${OBS_DB_PORTA:-5432}:5432"
    volumes:
      - observatorio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  observatorio_pgdata:
